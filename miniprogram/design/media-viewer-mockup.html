<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>去哪滑 · 发现页内容预览高保真稿</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      background: #f2f2f5;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      padding: 40px;
      flex-wrap: wrap;
    }
    .phone {
      width: 375px;
      height: 812px;
      background: #000;
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .label {
      position: absolute;
      top: -32px;
      left: 0;
      font-size: 14px;
      color: #6b6b75;
      font-weight: 500;
    }
    .status-bar { height: 44px; width: 100%; }
    .top-bar {
      position: absolute;
      top: 44px;
      left: 0;
      right: 0;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      z-index: 10;
    }
    .counter {
      color: rgba(255,255,255,0.9);
      font-size: 15px;
      font-weight: 500;
    }
    .close {
      position: absolute;
      right: 16px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-area {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .placeholder {
      width: 100%;
      height: 420px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .dots {
      position: absolute;
      bottom: 60px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 10;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
    }
    .dot.active {
      width: 7px;
      height: 7px;
      background: #FF5A36;
    }
    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
    }
    .play-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(17,17,20,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    .home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(255,255,255,0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <!-- 状态 A：图片预览（第 3/5 张） -->
  <div class="phone">
    <div class="label">图片预览 · 3/5</div>
    <div class="status-bar"></div>
    <div class="top-bar">
      <div class="counter">3 / 5</div>
      <div class="close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
    </div>
    <div class="media-area">
      <div class="placeholder">
        <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <path d="M21 15l-5-5L5 21"></path>
        </svg>
      </div>
    </div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="home-bar"></div>
  </div>

  <!-- 状态 B：视频未播放态 -->
  <div class="phone">
    <div class="label">视频预览 · 未播放</div>
    <div class="status-bar"></div>
    <div class="top-bar">
      <div class="counter">2 / 4</div>
      <div class="close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
    </div>
    <div class="media-area">
      <div class="placeholder">
        <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <path d="M21 15l-5-5L5 21"></path>
        </svg>
      </div>
    </div>
    <div class="play-overlay">
      <div class="play-btn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="0">
          <polygon points="7,4 21,12 7,20"></polygon>
        </svg>
      </div>
    </div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="home-bar"></div>
  </div>

</body>
</html>
