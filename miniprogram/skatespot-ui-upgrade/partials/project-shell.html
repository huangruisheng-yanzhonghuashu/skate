<!--
  复制纪律（对全部 SECTION 生效）：
  1. 逐字复制：类名、DOM 结构、属性顺序、注释均不得改动；
     唯一允许修改的内容位：
       · SECTION 2 中 SLOT: pageTitle 注释之后的标题文本；
       · SECTION 4 的 active 标记（见下）。
  2. active 态规则（仅限 tabBar）：从 SECTION 4 的 4 个变体中逐字取用
     与当前页面对应的那个变体；只允许 data-active="true" 与
     .sk8-tab-item-on 落位不同，图标、文字、顺序、几何完全一致。
     禁止自行增删 tab、改标签文字、换图标名。
  3. CSS 注入：SECTION 5 / SECTION 6 / SECTION 7 的 <style> 内容逐字
     并入叶子页 <style>（或 head 内联样式），三段顺序保持
     5 → 6 → 7，不得删改任何声明。
  4. 颜色纪律：本片段全部颜色仅来自 var(--sk8-*) / var(--state-*)；
     叶子页复制后同样不得引入新的裸色值。
  5. 页面组装顺序（tab 页）：
       SECTION 1 状态栏 → SECTION 2 导航栏 → <main>…</main>
       → SECTION 4 tabBar（含 .sk8-safe-bottom）
     详情页：SECTION 1 状态栏（可选）→ 媒体区（内叠 SECTION 3 沉浸层）
     → 内容区；详情页不渲染 SECTION 4 tabBar。
  6. 安全区：tab 页内容区底部预留 tabBar(50px)+安全区(34px)=84px；
     .sk8-safe-bottom 紧跟 .sk8-tabbar 之后，共同构成底部 chrome。
  7. lucide：本片段仅以 data-lucide 属性声明图标，不写死 SVG path；
     lucide 脚本注入由叶子页 head 负责，本片段不注入任何脚本。
     线宽统一由 CSS 控制为 1.5px（stroke-width 覆写在 SECTION 5/7）。
  8. 逐字复制的片段不得被二次包裹改样式；如需页面级定位
     （如吸底），只允许在外层新增定位类，内部结构不动。
-->

<!-- ============================================================
  SECTION 5 · 共享 chrome CSS（<style> 逐字复制进叶子页）
  【复制规则】整段逐字并入叶子页 <style>，不得删改声明或改选择器名。
  颜色唯一来源 var(--sk8-*)；仅有的透明层均为令牌基色加透明度：
    · rgba(27,27,32,…) = --sk8-popover #1B1B20 的半透明形态（系统胶囊底）
    · rgba(0,0,0,…) / rgba(255,255,255,…) = 沉浸层中性遮罩（保证深色图可读）
============================================================ -->
<style>
  /* ===== 状态栏 44px：背景透明，叠底色由页面定 ===== */
  .sk8-statusbar {
    height: 44px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px 0 26px;
    background: transparent;
    color: var(--sk8-foreground);
    font-family: var(--sk8-font-sans);
  }
  .sk8-statusbar-time {
    font-size: var(--sk8-fs-h3);
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .sk8-statusbar-icons {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .sk8-statusbar-icon {
    width: 16px;
    height: 16px;
    stroke-width: 1.5px;
  }

  /* ===== 标准导航栏 44px：居中标题 + 右侧系统胶囊 ===== */
  .sk8-navbar {
    position: relative;
    height: 44px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px 0 0;
    background: var(--sk8-background);
    border-bottom: 1px solid var(--sk8-border);
  }
  .sk8-navbar-left {
    width: 96px;
    height: 44px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    padding-left: 16px;
  }
  .sk8-navbar-title {
    position: absolute;
    top: 0;
    left: 96px;
    right: 96px;
    height: 44px;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--sk8-font-sans);
    font-size: var(--sk8-fs-h3);
    font-weight: 600;
    line-height: 1.2;
    color: var(--sk8-foreground);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: keep-all;
  }

  /* ===== 系统胶囊 88×32：1px 描边 + 半透明底，仅描边风 ===== */
  .sk8-capsule {
    width: 88px;
    height: 32px;
    box-sizing: border-box;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    border: 1px solid var(--sk8-border);
    border-radius: var(--sk8-radius-pill);
    background: rgba(27, 27, 32, 0.60); /* --sk8-popover #1B1B20 @60% */
    color: var(--sk8-foreground);
  }
  .sk8-capsule-btn {
    flex: 1 1 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--sk8-foreground);
    cursor: pointer;
    transition: opacity 120ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-capsule-btn:active { opacity: 0.7; }
  .sk8-capsule-btn:focus-visible { outline: 2px solid var(--sk8-ring); outline-offset: 2px; border-radius: var(--sk8-radius-pill); }
  .sk8-capsule-icon {
    width: 16px;
    height: 16px;
    stroke-width: 1.5px;
  }
  /* ellipsis 分隔点：旋转 90° 成为竖向点列分隔 */
  .sk8-capsule-divider {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    stroke-width: 1.5px;
    color: var(--sk8-text-faint);
    transform: rotate(90deg);
  }

  /* ===== 沉浸式导航层：叠在详情页媒体图上（44+44=88px） ===== */
  .sk8-nav-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
    height: 88px;
    box-sizing: border-box;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 8px 4px 12px;
    background: transparent;
  }
  .sk8-nav-back {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.12); /* 中性白描边，深色图上界定轮廓 */
    border-radius: var(--sk8-radius-pill);
    background: rgba(0, 0, 0, 0.36);              /* 中性黑遮罩 + blur，保证可读 */
    color: var(--sk8-foreground);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    cursor: pointer;
    transition: transform 120ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-nav-back:active { transform: scale(0.94); }
  .sk8-nav-back:focus-visible { outline: 2px solid var(--sk8-ring); outline-offset: 2px; }
  .sk8-nav-back-icon {
    width: 20px;
    height: 20px;
    stroke-width: 1.5px;
  }
  /* 叠层语境下的胶囊：加深底 + blur，深色图上保持可读 */
  .sk8-nav-overlay .sk8-capsule {
    background: rgba(27, 27, 32, 0.72); /* --sk8-popover @72% */
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* ===== 底部 tabBar 50px：--sk8-bar 底 + 顶部 1px --sk8-border ===== */
  .sk8-tabbar {
    height: 50px;
    box-sizing: border-box;
    display: flex;
    align-items: stretch;
    background: var(--sk8-bar);
    border-top: 1px solid var(--sk8-border);
    font-family: var(--sk8-font-sans);
  }
  .sk8-tab-item {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--sk8-muted-foreground);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .sk8-tab-item:active .sk8-tab-icon { transform: scale(0.92); }
  .sk8-tab-icon {
    width: 20px;
    height: 20px;
    stroke-width: 1.5px;
    transition: transform 120ms cubic-bezier(.2, .8, .2, 1), color 120ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-tab-label {
    font-size: var(--sk8-fs-body-s);
    line-height: 1.2;
    transition: color 120ms cubic-bezier(.2, .8, .2, 1);
  }
  /* active：仅图标+文字变主色、文字 600 字重，几何不变 */
  .sk8-tab-item[data-active="true"] { color: var(--sk8-primary); }
  .sk8-tab-item[data-active="true"] .sk8-tab-label { font-weight: 600; }

  /* ===== 底部安全区占位 34px（跟随 bar 底色） ===== */
  .sk8-safe-bottom {
    height: env(safe-area-inset-bottom, 34px);
    background: var(--sk8-bar);
  }

  @media (prefers-reduced-motion: reduce) {
    .sk8-tab-icon,
    .sk8-tab-label,
    .sk8-capsule-btn,
    .sk8-nav-back { transition-duration: 0.01ms; }
    .sk8-tab-item:active .sk8-tab-icon,
    .sk8-nav-back:active { transform: none; }
  }
</style>
