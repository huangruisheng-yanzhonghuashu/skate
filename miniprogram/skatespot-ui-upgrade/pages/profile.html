/* ============================================================
   SkateSpot 小程序 · 品牌令牌（暗色街头风）
   单一品牌主色：霓虹橘红 #FF5A36；状态色仅用于语义状态。
   默认暗色（:root），.light 提供亮色兜底。
   ============================================================ */

:root {
  /* Surfaces（暗色层级：底 → 卡片 → 浮层） */
  --sk8-background: #111114;
  --sk8-card: #1E1E23;
  --sk8-inset: #17171B;
  --sk8-surface-2: #26262C;
  --sk8-popover: #1B1B20;
  --sk8-bar: #1A1A1E;

  /* Foreground 文本层级：白 → 次级 → 弱化 → 占位 */
  --sk8-foreground: #FFFFFF;
  --sk8-card-foreground: #FFFFFF;
  --sk8-popover-foreground: #FFFFFF;
  --sk8-text-secondary: #D9D9DE;
  --sk8-text-tertiary: #A6A6AD;
  --sk8-muted-foreground: #8C8C94;
  --sk8-text-faint: #6E6E76;

  /* Primary（唯一品牌色相） */
  --sk8-primary: #FF5A36;
  --sk8-primary-foreground: #FFFFFF;
  --sk8-primary-strong: #E64A26;
  --sk8-primary-bright: #FF8A6E;
  --sk8-primary-soft: rgba(255, 90, 54, 0.14);
  --sk8-primary-soft-strong: rgba(255, 90, 54, 0.24);

  /* Lines / Inputs / Ring */
  --sk8-border: #26262C;
  --sk8-border-strong: #2A2A30;
  --sk8-input: #17171B;
  --sk8-ring: #FF5A36;

  /* Muted */
  --sk8-muted: #26262C;

  /* 语义状态色（仅状态语义，不做装饰） */
  --state-success: #00D4AA;
  --state-success-soft: rgba(0, 212, 170, 0.12);
  --state-success-ink: #003B30;
  --state-warning: #FFB800;
  --state-warning-soft: rgba(255, 184, 0, 0.12);
  --state-error: #FF3B30;
  --state-error-soft: rgba(255, 59, 48, 0.14);
  --state-info: #2A8CFF;
  --state-info-soft: rgba(42, 140, 255, 0.12);

  /* Radius（收敛三档 + 胶囊） */
  --sk8-radius-small: 6px;
  --sk8-radius-medium: 10px;
  --sk8-radius-large: 16px;
  --sk8-radius-pill: 999px;

  /* 深度：静态面用描边/分层，浮层可用深阴影 */
  --sk8-shadow-float: 0 -8px 32px rgba(0, 0, 0, 0.5);
  --sk8-shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.4);

  /* Typography scale（小程序基准 14px） */
  --sk8-font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --sk8-fs-caption: 11px;
  --sk8-fs-body-s: 12px;
  --sk8-fs-body: 14px;
  --sk8-fs-h3: 16px;
  --sk8-fs-h2: 18px;
  --sk8-fs-h1: 20px;
}

/* 本项目为纯暗色小程序设计：:root 即暗色令牌，无亮色覆盖（脚本输出的主题类不改变取值） */

/* ===== 字体类 ===== */
.sk8-type-h1 { font-family: var(--sk8-font-sans); font-size: var(--sk8-fs-h1); font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
.sk8-type-h2 { font-family: var(--sk8-font-sans); font-size: var(--sk8-fs-h2); font-weight: 600; line-height: 1.35; }
.sk8-type-h3 { font-family: var(--sk8-font-sans); font-size: var(--sk8-fs-h3); font-weight: 600; line-height: 1.4; }
.sk8-type-body { font-family: var(--sk8-font-sans); font-size: var(--sk8-fs-body); font-weight: 400; line-height: 1.6; }
.sk8-type-body-s { font-family: var(--sk8-font-sans); font-size: var(--sk8-fs-body-s); font-weight: 400; line-height: 1.5; }
.sk8-type-caption { font-family: var(--sk8-font-sans); font-size: var(--sk8-fs-caption); font-weight: 400; line-height: 1.45; }
.sk8-num { font-variant-numeric: tabular-nums; }

<style>
  /* ===== 状态栏 44px：背景透明，叠底色由页面定 ===== */
  .sk8-statusbar {
    height: 44px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px 0 26px;
    background: transparent;
    color: var(--sk8-foreground);
    font-family: var(--sk8-font-sans);
  }
  .sk8-statusbar-time {
    font-size: var(--sk8-fs-h3);
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .sk8-statusbar-icons {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .sk8-statusbar-icon {
    width: 16px;
    height: 16px;
    stroke-width: 1.5px;
  }

  /* ===== 标准导航栏 44px：居中标题 + 右侧系统胶囊 ===== */
  .sk8-navbar {
    position: relative;
    height: 44px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px 0 0;
    background: var(--sk8-background);
    border-bottom: 1px solid var(--sk8-border);
  }
  .sk8-navbar-left {
    width: 96px;
    height: 44px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    padding-left: 16px;
  }
  .sk8-navbar-title {
    position: absolute;
    top: 0;
    left: 96px;
    right: 96px;
    height: 44px;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--sk8-font-sans);
    font-size: var(--sk8-fs-h3);
    font-weight: 600;
    line-height: 1.2;
    color: var(--sk8-foreground);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: keep-all;
  }

  /* ===== 系统胶囊 88×32：1px 描边 + 半透明底，仅描边风 ===== */
  .sk8-capsule {
    width: 88px;
    height: 32px;
    box-sizing: border-box;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    border: 1px solid var(--sk8-border);
    border-radius: var(--sk8-radius-pill);
    background: rgba(27, 27, 32, 0.60); /* --sk8-popover #1B1B20 @60% */
    color: var(--sk8-foreground);
  }
  .sk8-capsule-btn {
    flex: 1 1 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--sk8-foreground);
    cursor: pointer;
    transition: opacity 120ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-capsule-btn:active { opacity: 0.7; }
  .sk8-capsule-btn:focus-visible { outline: 2px solid var(--sk8-ring); outline-offset: 2px; border-radius: var(--sk8-radius-pill); }
  .sk8-capsule-icon {
    width: 16px;
    height: 16px;
    stroke-width: 1.5px;
  }
  /* ellipsis 分隔点：旋转 90° 成为竖向点列分隔 */
  .sk8-capsule-divider {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    stroke-width: 1.5px;
    color: var(--sk8-text-faint);
    transform: rotate(90deg);
  }

  /* ===== 沉浸式导航层：叠在详情页媒体图上（44+44=88px） ===== */
  .sk8-nav-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
    height: 88px;
    box-sizing: border-box;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 8px 4px 12px;
    background: transparent;
  }
  .sk8-nav-back {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.12); /* 中性白描边，深色图上界定轮廓 */
    border-radius: var(--sk8-radius-pill);
    background: rgba(0, 0, 0, 0.36);              /* 中性黑遮罩 + blur，保证可读 */
    color: var(--sk8-foreground);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    cursor: pointer;
    transition: transform 120ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-nav-back:active { transform: scale(0.94); }
  .sk8-nav-back:focus-visible { outline: 2px solid var(--sk8-ring); outline-offset: 2px; }
  .sk8-nav-back-icon {
    width: 20px;
    height: 20px;
    stroke-width: 1.5px;
  }
  /* 叠层语境下的胶囊：加深底 + blur，深色图上保持可读 */
  .sk8-nav-overlay .sk8-capsule {
    background: rgba(27, 27, 32, 0.72); /* --sk8-popover @72% */
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* ===== 底部 tabBar 50px：--sk8-bar 底 + 顶部 1px --sk8-border ===== */
  .sk8-tabbar {
    height: 50px;
    box-sizing: border-box;
    display: flex;
    align-items: stretch;
    background: var(--sk8-bar);
    border-top: 1px solid var(--sk8-border);
    font-family: var(--sk8-font-sans);
  }
  .sk8-tab-item {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--sk8-muted-foreground);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .sk8-tab-item:active .sk8-tab-icon { transform: scale(0.92); }
  .sk8-tab-icon {
    width: 20px;
    height: 20px;
    stroke-width: 1.5px;
    transition: transform 120ms cubic-bezier(.2, .8, .2, 1), color 120ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-tab-label {
    font-size: var(--sk8-fs-body-s);
    line-height: 1.2;
    transition: color 120ms cubic-bezier(.2, .8, .2, 1);
  }
  /* active：仅图标+文字变主色、文字 600 字重，几何不变 */
  .sk8-tab-item[data-active="true"] { color: var(--sk8-primary); }
  .sk8-tab-item[data-active="true"] .sk8-tab-label { font-weight: 600; }

  /* ===== 底部安全区占位 34px（跟随 bar 底色） ===== */
  .sk8-safe-bottom {
    height: env(safe-area-inset-bottom, 34px);
    background: var(--sk8-bar);
  }

  @media (prefers-reduced-motion: reduce) {
    .sk8-tab-icon,
    .sk8-tab-label,
    .sk8-capsule-btn,
    .sk8-nav-back { transition-duration: 0.01ms; }
    .sk8-tab-item:active .sk8-tab-icon,
    .sk8-nav-back:active { transform: none; }
  }
</style>

<style>

    align-items: center;

  .sk8-btn-ghost:disabled { color: var(--sk8-text-faint); cursor: not-allowed; opacity: 0.6; }

  /* ===== 卡片：--sk8-card 底 + 10px 圆角 + 1px 描边，无深阴影 ===== */

    padding: 16px;

    border-radius: var(--sk8-radius-medium);

    padding: 0 8px;
    flex-shrink: 0;

    background: var(--sk8-primary-soft);

  }

  /* ===== 分段控件：内嵌底 --sk8-inset，高 32px，圆角 8px =====
     用法：<div class="sk8-seg"><button class="sk8-seg-item sk8-seg-item-on" type="button">…</button><button class="sk8-seg-item" type="button">…</button></div> */
  .sk8-seg {
    box-sizing: border-box;
    height: 32px;
    display: flex;
    align-items: stretch;
    padding: 2px;
    border-radius: 8px;
    background: var(--sk8-inset);
  }
  .sk8-seg-item {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--sk8-text-tertiary);
    font-family: var(--sk8-font-sans);
    font-size: var(--sk8-fs-body);
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 160ms cubic-bezier(.2, .8, .2, 1), color 160ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-seg-item:active { color: var(--sk8-text-secondary); }
  .sk8-seg-item:focus-visible { outline: 2px solid var(--sk8-ring); outline-offset: 1px; }
  .sk8-seg-item-on {
    background: var(--sk8-surface-2);
    color: var(--sk8-foreground);
    font-weight: 600;
  }

  /* ===== 状态点：8px 圆点 + 三语义变体（success/warning/error） ===== */
  .sk8-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    flex-shrink: 0;
    border-radius: var(--sk8-radius-pill);
    background: var(--sk8-text-faint);
  }
  .sk8-dot-success { background: var(--state-success); }
  .sk8-dot-warning { background: var(--state-warning); }
  .sk8-dot-error   { background: var(--state-error); }

  /* ===== 标签 chip：26px 胶囊 + 12px 字，选中态橙字橙底 14% ===== */
  .sk8-chip {
    display: inline-flex;
    align-items: center;
    height: 26px;
    padding: 0 12px;
    flex-shrink: 0;
    border: 0;
    border-radius: var(--sk8-radius-pill);
    background: var(--sk8-surface-2);
    color: var(--sk8-text-tertiary);
    font-family: var(--sk8-font-sans);
    font-size: var(--sk8-fs-body-s);
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 120ms cubic-bezier(.2, .8, .2, 1), color 120ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-chip:focus-visible { outline: 2px solid var(--sk8-ring); outline-offset: 2px; }
  .sk8-chip-on {
    background: var(--sk8-primary-soft);
    color: var(--sk8-primary-bright);
    font-weight: 600;
  }

  /* ===== 信息行：20px 图标 + 14px 文本 + 右侧箭头，行高 48px =====
     用法：<button class="sk8-info-row" type="button"><i data-lucide="map-pin" class="sk8-info-row-icon"></i><span class="sk8-info-row-text">…</span><i data-lucide="chevron-right" class="sk8-info-row-arrow"></i></button> */
  .sk8-info-row {
    box-sizing: border-box;
    width: 100%;
    height: 48px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 2px;
    border: 0;
    background: transparent;
    color: var(--sk8-text-secondary);
    font-family: var(--sk8-font-sans);
    font-size: var(--sk8-fs-body);
    line-height: 1.4;
    text-align: left;
    cursor: pointer;
  }
  .sk8-info-row:focus-visible { outline: 2px solid var(--sk8-ring); outline-offset: 2px; border-radius: var(--sk8-radius-small); }
  .sk8-info-row-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    stroke-width: 1.5px;
    color: var(--sk8-text-tertiary);
  }
  .sk8-info-row-text {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sk8-info-row-arrow {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    stroke-width: 1.5px;
    color: var(--sk8-text-faint);
  }

  /* ===== 统计数字：20px/700 tabular-nums + 11px 单位 ===== */
  .sk8-stat-num {
    font-family: var(--sk8-font-sans);
    font-size: var(--sk8-fs-h1);
    font-weight: 700;
    line-height: 1.2;
    color: var(--sk8-foreground);
    font-variant-numeric: tabular-nums;
  }
  .sk8-stat-unit {
    font-family: var(--sk8-font-sans);
    font-size: var(--sk8-fs-caption);
    font-weight: 400;
    line-height: 1.4;
    color: var(--sk8-text-faint);
    margin-left: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .sk8-btn-primary,
    .sk8-btn-ghost,
    .sk8-seg-item,
    .sk8-chip { transition-duration: 0.01ms; }
  }
</style>

<!-- ============================================================
  页面级临界布局（静态 CSS，不依赖 Tailwind 运行时）
  仅新增 sk8-profile-* / sk8-stats-* / sk8-menu-* / sk8-logout 类，
  不改写外壳任何声明；颜色全部来自 var(--sk8-*)。
============================================================ -->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--sk8-background);
    color: var(--sk8-foreground);
    font-family: var(--sk8-font-sans);
  }

  /* ===== 页面容器：卡距 16px，底部预留 tabBar+安全区 84px ===== */
  .sk8-page {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px 16px 84px;
  }

  /* ===== 身份卡：头像 48 + 昵称/等级纵向分层 + 右上编辑入口 ===== */
  .sk8-profile-card {
    position: relative;
    display: flex;
    align-items: center;
    padding: 18px 16px;
  }
  .sk8-profile-main {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
    padding-right: 40px; /* 给右上角编辑热区留位，昵称永不与其重叠 */
  }
  .sk8-profile-avatar { box-shadow: 0 0 0 2px var(--sk8-border); }
  .sk8-profile-meta {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .sk8-profile-name {
    margin: 0;
    font-family: var(--sk8-font-sans);
    font-size: var(--sk8-fs-h2);
    font-weight: 600;
    line-height: 1.2;
    color: var(--sk8-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: keep-all;
  }
  .sk8-profile-level {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    font-family: var(--sk8-font-sans);
    font-size: var(--sk8-fs-body-s);
    line-height: 1.2;
    color: var(--sk8-text-tertiary);
    white-space: nowrap;
  }
  .sk8-profile-level-sep { color: var(--sk8-text-faint); }
  .sk8-profile-edit {
    position: absolute;
    top: 6px;
    right: 8px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--sk8-text-faint);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 120ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-profile-edit:active { color: var(--sk8-text-secondary); }
  .sk8-profile-edit:focus-visible { outline: 2px solid var(--sk8-ring); outline-offset: 2px; border-radius: var(--sk8-radius-pill); }
  .sk8-profile-edit-icon {
    width: 16px;
    height: 16px;
    stroke-width: 1.5px;
  }

  /* ===== 数据带：三列等分 + 1px 竖线分隔（同签到页） ===== */
  .sk8-stats-card {
    display: flex;
    align-items: stretch;
    padding: 18px 0;
  }
  .sk8-stat-cell {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
  }
  .sk8-stat-cell + .sk8-stat-cell { border-left: 1px solid var(--sk8-border); }
  .sk8-stat-label {
    font-family: var(--sk8-font-sans);
    font-size: var(--sk8-fs-caption);
    line-height: 1.45;
    color: var(--sk8-text-tertiary);
    white-space: nowrap;
  }

  /* ===== 菜单卡：行间 1px 分隔，行高与图标用外壳 .sk8-info-row ===== */
  .sk8-menu-card {
    display: flex;
    flex-direction: column;
    padding: 10px 16px;
  }
  .sk8-menu-card a.sk8-info-row { text-decoration: none; }
  .sk8-menu-card .sk8-info-row + .sk8-info-row { border-top: 1px solid var(--sk8-border); }
  .sk8-menu-card .sk8-info-row {
    -webkit-tap-highlight-color: transparent;
    transition: color 120ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-menu-card .sk8-info-row:active { color: var(--sk8-foreground); }
  .sk8-menu-card .sk8-info-row-icon { transition: transform 120ms cubic-bezier(.2, .8, .2, 1); }
  .sk8-menu-card .sk8-info-row:active .sk8-info-row-icon { transform: translateX(2px); }

  /* ===== 退出登录：无边框无底色文字按钮 ===== */
  .sk8-logout-wrap { display: flex; justify-content: center; }
  .sk8-logout {
    height: 48px;
    padding: 0 24px;
    border: 0;
    background: transparent;
    font-family: var(--sk8-font-sans);
    font-size: var(--sk8-fs-body);
    line-height: 1;
    color: var(--sk8-text-tertiary);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 120ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-logout:active { color: var(--sk8-text-secondary); }
  .sk8-logout:focus-visible { outline: 2px solid var(--sk8-ring); outline-offset: 2px; border-radius: var(--sk8-radius-small); }

  @media (prefers-reduced-motion: reduce) {
    .sk8-menu-card .sk8-info-row,
    .sk8-menu-card .sk8-info-row-icon,
    .sk8-logout,
    .sk8-profile-edit { transition-duration: 0.01ms; }
    .sk8-menu-card .sk8-info-row:active .sk8-info-row-icon { transform: none; }
  }
</style>
