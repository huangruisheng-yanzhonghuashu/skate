    <style id="theme-vars">
/* ============================================================
   SkateSpot 小程序 · 品牌令牌（暗色街头风）
   单一品牌主色：霓虹橘红 #FF5A36；状态色仅用于语义状态。
   默认暗色（:root），.light 提供亮色兜底。
   ============================================================ */

:root {
  /* Surfaces（暗色层级：底 → 卡片 → 浮层） */
  --sk8-background: #111114;
  --sk8-card: #1E1E23;
  --sk8-inset: #17171B;
  --sk8-surface-2: #26262C;
  --sk8-popover: #1B1B20;
  --sk8-bar: #1A1A1E;

  /* Foreground 文本层级：白 → 次级 → 弱化 → 占位 */
  --sk8-foreground: #FFFFFF;
  --sk8-card-foreground: #FFFFFF;
  --sk8-popover-foreground: #FFFFFF;
  --sk8-text-secondary: #D9D9DE;
  --sk8-text-tertiary: #A6A6AD;
  --sk8-muted-foreground: #8C8C94;
  --sk8-text-faint: #6E6E76;

  /* Primary（唯一品牌色相） */
  --sk8-primary: #FF5A36;
  --sk8-primary-foreground: #FFFFFF;
  --sk8-primary-strong: #E64A26;
  --sk8-primary-bright: #FF8A6E;
  --sk8-primary-soft: rgba(255, 90, 54, 0.14);
  --sk8-primary-soft-strong: rgba(255, 90, 54, 0.24);

  /* Lines / Inputs / Ring */
  --sk8-border: #26262C;
  --sk8-border-strong: #2A2A30;
  --sk8-input: #17171B;
  --sk8-ring: #FF5A36;

  /* Muted */
  --sk8-muted: #26262C;

  /* 语义状态色（仅状态语义，不做装饰） */
  --state-success: #00D4AA;
  --state-success-soft: rgba(0, 212, 170, 0.12);
  --state-success-ink: #003B30;
  --state-warning: #FFB800;
  --state-warning-soft: rgba(255, 184, 0, 0.12);
  --state-error: #FF3B30;
  --state-error-soft: rgba(255, 59, 48, 0.14);
  --state-info: #2A8CFF;
  --state-info-soft: rgba(42, 140, 255, 0.12);

  /* Radius（收敛三档 + 胶囊） */
  --sk8-radius-small: 6px;
  --sk8-radius-medium: 10px;
  --sk8-radius-large: 16px;
  --sk8-radius-pill: 999px;

  /* 深度：静态面用描边/分层，浮层可用深阴影 */
  --sk8-shadow-float: 0 -8px 32px rgba(0, 0, 0, 0.5);
  --sk8-shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.4);

  /* Typography scale（小程序基准 14px） */
  --sk8-font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --sk8-fs-caption: 11px;
  --sk8-fs-body-s: 12px;
  --sk8-fs-body: 14px;
  --sk8-fs-h3: 16px;
  --sk8-fs-h2: 18px;
  --sk8-fs-h1: 20px;
}

/* 本项目为纯暗色小程序设计：:root 即暗色令牌，无亮色覆盖（脚本输出的主题类不改变取值） */

/* ===== 字体类 ===== */
.sk8-type-h1 { font-family: var(--sk8-font-sans); font-size: var(--sk8-fs-h1); font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
.sk8-type-h2 { font-family: var(--sk8-font-sans); font-size: var(--sk8-fs-h2); font-weight: 600; line-height: 1.35; }
.sk8-type-h3 { font-family: var(--sk8-font-sans); font-size: var(--sk8-fs-h3); font-weight: 600; line-height: 1.4; }
.sk8-type-body { font-family: var(--sk8-font-sans); font-size: var(--sk8-fs-body); font-weight: 400; line-height: 1.6; }
.sk8-type-body-s { font-family: var(--sk8-font-sans); font-size: var(--sk8-fs-body-s); font-weight: 400; line-height: 1.5; }
.sk8-type-caption { font-family: var(--sk8-font-sans); font-size: var(--sk8-fs-caption); font-weight: 400; line-height: 1.45; }
.sk8-num { font-variant-numeric: tabular-nums; }

    </style>

    <style id="checkins-v2-enhancements">
      /* ===== 统计数字 P0/P1：更大数字 + 更小单位/标签 ===== */
      .stat-band .stat-label { font-size: 12px; line-height: 1.2; color: var(--sk8-text-tertiary); }
      .stat-band .stat-value { align-items: baseline; gap: 2px; }
      .stat-band .stat-value .sk8-stat-num { font-size: 32px; font-weight: 700; line-height: 1; }
      .stat-band .stat-value .sk8-stat-unit { font-size: 12px; color: var(--sk8-text-tertiary); margin-left: 0; }

      /* ===== 日历状态：未来灰显 / 过去未签点 / 已签橙底 ===== */
      .cal-cell-done .cal-num {
        width: 28px; height: 28px;
        display: flex; align-items: center; justify-content: center;
        border-radius: var(--sk8-radius-pill);
        background: var(--sk8-primary);
        color: var(--sk8-primary-foreground);
        font-weight: 600;
      }
      .cal-cell-done::after { display: none; }
      .cal-cell-future .cal-num { color: var(--sk8-text-faint); opacity: 0.45; }
      .cal-cell-missed::after {
        content: "";
        position: absolute;
        bottom: 5px; left: 50%;
        transform: translateX(-50%);
        width: 3px; height: 3px;
        border-radius: var(--sk8-radius-pill);
        background: var(--sk8-text-faint);
        opacity: 0.7;
      }
      .cal-cell-today .cal-today-num {
        width: 28px; height: 28px;
        display: flex; align-items: center; justify-content: center;
        border-radius: var(--sk8-radius-pill);
        background: var(--sk8-primary);
        color: var(--sk8-primary-foreground);
        font-size: var(--sk8-fs-body-s);
        font-weight: 600;
      }

      /* ===== 排行榜奖章与领奖台 ===== */
      .rank-medal { width: 18px; height: 18px; stroke-width: 1.5px; }
      .rank-medal-gold { color: #FFD700; }
      .rank-medal-silver { color: #C7C7CC; }
      .rank-medal-bronze { color: #CD7F32; }
      .rank-podium {
        display: flex; align-items: flex-end; justify-content: center;
        gap: 6px; margin-top: 12px; height: 48px;
      }
      .rank-podium-bar {
        width: 36px;
        border-radius: 6px 6px 0 0;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        padding-bottom: 5px;
        color: var(--sk8-background);
        font-family: var(--sk8-font-sans);
        font-size: var(--sk8-fs-caption);
        font-weight: 600; line-height: 1;
      }
      .rank-podium-gold { height: 48px; background: linear-gradient(180deg, #FFD700 0%, #D4AF37 100%); }
      .rank-podium-silver { height: 34px; background: linear-gradient(180deg, #E5E5EA 0%, #C7C7CC 100%); }
      .rank-podium-bronze { height: 26px; background: linear-gradient(180deg, #E6A65C 0%, #CD7F32 100%); }

      /* ===== 本周进度：圆环 + 分段条 ===== */
      .progress-card { display: flex; align-items: center; gap: 16px; }
      .progress-ring { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
      .progress-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .progress-ring-bg { fill: none; stroke: var(--sk8-inset); stroke-width: 8; }
      .progress-ring-fill { fill: none; stroke: var(--sk8-primary); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 600ms cubic-bezier(.2, .8, .2, 1); }
      .progress-ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .progress-ring-num { font-family: var(--sk8-font-sans); font-size: 18px; font-weight: 700; line-height: 1; color: var(--sk8-foreground); }
      .progress-ring-unit { font-family: var(--sk8-font-sans); font-size: var(--sk8-fs-caption); color: var(--sk8-text-tertiary); }
      .progress-segments { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
      .progress-label-row { display: flex; align-items: center; justify-content: space-between; font-family: var(--sk8-font-sans); font-size: 12px; color: var(--sk8-text-tertiary); }
      .progress-seg-bar { display: flex; gap: 4px; }
      .progress-seg { flex: 1 1 0; height: 28px; border-radius: var(--sk8-radius-small); background: var(--sk8-inset); transition: background-color 240ms cubic-bezier(.2, .8, .2, 1); }
      .progress-seg-on { background: var(--sk8-primary); }
      .progress-seg-today { box-shadow: inset 0 0 0 1px var(--sk8-primary); }

      /* ===== 删除手势优化：统一可滑动轨道 ===== */
      .rec-track { display: flex; align-items: stretch; transition: transform 240ms cubic-bezier(.3, 0, 0, 1); }
      .rec-track-open { transform: translateX(-72px); }
    </style>
</head>

<!-- ===== 共享外壳 CSS（project-shell SECTION 5，逐字复制） ===== -->
<style>
  /* ===== 状态栏 44px：背景透明，叠底色由页面定 ===== */
  .sk8-statusbar {
    height: 44px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px 0 26px;
    background: transparent;
    color: var(--sk8-foreground);
    font-family: var(--sk8-font-sans);
  }
  .sk8-statusbar-time {
    font-size: var(--sk8-fs-h3);
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .sk8-statusbar-icons {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .sk8-statusbar-icon {
    width: 16px;
    height: 16px;
    stroke-width: 1.5px;
  }

  /* ===== 标准导航栏 44px：居中标题 + 右侧系统胶囊 ===== */
  .sk8-navbar {
    position: relative;
    height: 44px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px 0 0;
    background: var(--sk8-background);
    border-bottom: 1px solid var(--sk8-border);
  }
  .sk8-navbar-left {
    width: 96px;
    height: 44px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    padding-left: 16px;
  }
  .sk8-navbar-title {
    position: absolute;
    top: 0;
    left: 96px;
    right: 96px;
    height: 44px;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--sk8-font-sans);
    font-size: var(--sk8-fs-h3);
    font-weight: 600;
    line-height: 1.2;
    color: var(--sk8-foreground);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: keep-all;
  }

  /* ===== 系统胶囊 88×32：1px 描边 + 半透明底，仅描边风 ===== */
  .sk8-capsule {
    width: 88px;
    height: 32px;
    box-sizing: border-box;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    border: 1px solid var(--sk8-border);
    border-radius: var(--sk8-radius-pill);
    background: rgba(27, 27, 32, 0.60); /* --sk8-popover #1B1B20 @60% */
    color: var(--sk8-foreground);
  }
  .sk8-capsule-btn {
    flex: 1 1 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--sk8-foreground);
    cursor: pointer;
    transition: opacity 120ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-capsule-btn:active { opacity: 0.7; }
  .sk8-capsule-btn:focus-visible { outline: 2px solid var(--sk8-ring); outline-offset: 2px; border-radius: var(--sk8-radius-pill); }
  .sk8-capsule-icon {
    width: 16px;
    height: 16px;
    stroke-width: 1.5px;
  }
  /* ellipsis 分隔点：旋转 90° 成为竖向点列分隔 */
  .sk8-capsule-divider {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    stroke-width: 1.5px;
    color: var(--sk8-text-faint);
    transform: rotate(90deg);
  }

  /* ===== 沉浸式导航层：叠在详情页媒体图上（44+44=88px） ===== */
  .sk8-nav-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
    height: 88px;
    box-sizing: border-box;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 8px 4px 12px;
    background: transparent;
  }
  .sk8-nav-back {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.12); /* 中性白描边，深色图上界定轮廓 */
    border-radius: var(--sk8-radius-pill);
    background: rgba(0, 0, 0, 0.36);              /* 中性黑遮罩 + blur，保证可读 */
    color: var(--sk8-foreground);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    cursor: pointer;
    transition: transform 120ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-nav-back:active { transform: scale(0.94); }
  .sk8-nav-back:focus-visible { outline: 2px solid var(--sk8-ring); outline-offset: 2px; }
  .sk8-nav-back-icon {
    width: 20px;
    height: 20px;
    stroke-width: 1.5px;
  }
  /* 叠层语境下的胶囊：加深底 + blur，深色图上保持可读 */
  .sk8-nav-overlay .sk8-capsule {
    background: rgba(27, 27, 32, 0.72); /* --sk8-popover @72% */
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* ===== 底部 tabBar 50px：--sk8-bar 底 + 顶部 1px --sk8-border ===== */
  .sk8-tabbar {
    height: 50px;
    box-sizing: border-box;
    display: flex;
    align-items: stretch;
    background: var(--sk8-bar);
    border-top: 1px solid var(--sk8-border);
    font-family: var(--sk8-font-sans);
  }
  .sk8-tab-item {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--sk8-muted-foreground);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .sk8-tab-item:active .sk8-tab-icon { transform: scale(0.92); }
  .sk8-tab-icon {
    width: 20px;
    height: 20px;
    stroke-width: 1.5px;
    transition: transform 120ms cubic-bezier(.2, .8, .2, 1), color 120ms cubic-bezier(.2, .8, .2, 1);
  }
  .sk8-tab-label {
    font-size: var(--sk8-fs-body-s);
    line-height: 1.2;
    transition: color 120ms cubic-bezier(.2, .8, .2, 1);
  }
  /* active：仅图标+文字变主色、文字 600 字重，几何不变 */
  .sk8-tab-item[data-active="true"] { color: var(--sk8-primary); }
  .sk8-tab-item[data-active="true"] .sk8-tab-label { font-weight: 600; }

  /* ===== 底部安全区占位 34px（跟随 bar 底色） ===== */
  .sk8-safe-bottom {
    height: env(safe-area-inset-bottom, 34px);
    background: var(--sk8-bar);
  }

  @media (prefers-reduced-motion: reduce) {
    .sk8-tab-icon,
    .sk8-tab-label,
    .sk8-capsule-btn,
    .sk8-nav-back { transition-duration: 0.01ms; }
    .sk8-tab-item:active .sk8-tab-icon,
    .sk8-nav-back:active { transform: none; }
  }
</style>

<style>
  /* ===== 头像基元：胶囊圆 + 白字首字母居中 ===== */
  .sk8-avatar {
    display: inline-flex;
    align-items: center;

<div class="sk8-safe-bottom"></div>
    <script>
      // 最近记录统一左滑删除手势
      (function () {
        var swipes = document.querySelectorAll('.rec-swipe');
        swipes.forEach(function (swipe) {
          var track = swipe.querySelector('.rec-track');
          var startX = 0;
          var currentX = 0;
          var isOpen = track.classList.contains('rec-track-open');
          swipe.addEventListener('touchstart', function (e) {
            startX = e.touches[0].clientX;
            currentX = startX;
          }, { passive: true });
          swipe.addEventListener('touchmove', function (e) {
            currentX = e.touches[0].clientX;
            var delta = currentX - startX;
            if (delta < 0 && delta > -72) {
              track.style.transform = 'translateX(' + delta + 'px)';
            } else if (delta > 0 && isOpen) {
              track.style.transform = 'translateX(' + (delta - 72) + 'px)';
            }
          }, { passive: true });
          swipe.addEventListener('touchend', function () {
            var delta = currentX - startX;
            if (delta < -36) {
              track.classList.add('rec-track-open');
              isOpen = true;
            } else if (delta > 36 && isOpen) {
              track.classList.remove('rec-track-open');
              isOpen = false;
            }
            track.style.transform = '';
          });
          var delBtn = track.querySelector('.rec-delete');
          if (delBtn) {
            delBtn.addEventListener('click', function () {
              track.classList.remove('rec-track-open');
              isOpen = false;
            });
          }
        });
      })();
      lucide.createIcons();
    </script>
