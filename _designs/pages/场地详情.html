    <style id="theme-vars">
/* Skate Spot UI — Brand tokens */

:root {
  /* Primary brand: neon orange-red */
  --skate-primary-50: #FFF2EE;
  --skate-primary-100: #FFE0D6;
  --skate-primary-200: #FFC1B0;
  --skate-primary-300: #FF9A7E;
  --skate-primary-400: #FF5A36;
  --skate-primary-500: #FF4A24;
  --skate-primary-600: #E63A16;

  /* Neutral: street black + concrete grey scale */
  --skate-neutral-0: #FFFFFF;
  --skate-neutral-50: #F5F5F5;
  --skate-neutral-100: #E8E8E8;
  --skate-neutral-200: #D9D9D9;
  --skate-neutral-400: #8C8C8C;
  --skate-neutral-600: #4D4D4D;
  --skate-neutral-900: #1A1A1E;

  /* State colors */
  --skate-state-success: #00D4AA;
  --skate-state-warning: #FFB800;
  --skate-state-error: #FF3B30;
  --skate-state-info: #2A8CFF;

  /* Semantic aliases */
  --skate-background: var(--skate-neutral-50);
  --skate-foreground: var(--skate-neutral-900);
  --skate-card: var(--skate-neutral-0);
  --skate-card-foreground: var(--skate-neutral-900);
  --skate-popover: var(--skate-neutral-0);
  --skate-popover-foreground: var(--skate-neutral-900);
  --skate-primary: var(--skate-primary-400);
  --skate-primary-foreground: var(--skate-neutral-0);
  --skate-muted: var(--skate-neutral-100);
  --skate-muted-foreground: var(--skate-neutral-400);
  --skate-border: var(--skate-neutral-100);
  --skate-input: var(--skate-neutral-100);
  --skate-ring: var(--skate-primary-400);

  /* Radius */
  --skate-radius-sm: 4px;
  --skate-radius-md: 8px;
  --skate-radius-lg: 12px;
  --skate-radius-full: 9999px;

  /* Typography */
  --skate-font-title: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  --skate-font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;

  /* Shadow (only for floating layers) */
  --skate-shadow-float: 0 8px 24px rgba(26, 26, 30, 0.10);
}

@theme inline {
  --color-background: var(--skate-background);
  --color-foreground: var(--skate-foreground);
  --color-card: var(--skate-card);
  --color-card-foreground: var(--skate-card-foreground);
  --color-popover: var(--skate-popover);
  --color-popover-foreground: var(--skate-popover-foreground);
  --color-primary: var(--skate-primary);
  --color-primary-foreground: var(--skate-primary-foreground);
  --color-muted: var(--skate-muted);
  --color-muted-foreground: var(--skate-muted-foreground);
  --color-border: var(--skate-border);
  --color-input: var(--skate-input);
  --color-ring: var(--skate-ring);
  --radius-sm: var(--skate-radius-sm);
  --radius-md: var(--skate-radius-md);
  --radius-lg: var(--skate-radius-lg);
  --radius-full: var(--skate-radius-full);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

<body class="min-h-screen font-sans antialiased">
    <main>
        <!-- 状态栏 -->
        <div class="bg-[#1A1A1E] h-6 w-full"></div>

        <!-- 应用头部 -->
        <header class="bg-[#1A1A1E] sticky top-0 z-30">
            <div class="max-w-md mx-auto h-14 flex items-center justify-between px-4">
                <a href="#" data-dom-id="back-home" data-hide-edge="true" class="text-white p-2 -ml-2 rounded-full hover:bg-white/10 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
                        <path d="M19 12H5"/>
                        <path d="M12 19l-7-7 7-7"/>
                    </svg>
                </a>
                <h1 class="text-white text-lg font-semibold truncate px-2">滨江滑板公园</h1>
                <button type="button" class="text-white p-2 -mr-2 rounded-full hover:bg-white/10 transition-colors" aria-label="分享">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                        <circle cx="18" cy="5" r="3"/>
                        <circle cx="6" cy="12" r="3"/>
                        <circle cx="18" cy="19" r="3"/>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 主体内容 -->
        <div class="max-w-md mx-auto pb-32">
            <!-- 图片轮播 -->
            <section class="relative w-full h-[50vh] bg-[#1A1A1E] overflow-hidden">
                <img src="../assets/venue-skatepark.jpg" alt="滨江滑板公园" class="w-full h-full object-cover">
                <!-- 左右切换 -->
                <button type="button" class="absolute left-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white/80 text-[#1A1A1E] flex items-center justify-center shadow-sm hover:bg-white transition-colors" aria-label="上一张">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
                <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white/80 text-[#1A1A1E] flex items-center justify-center shadow-sm hover:bg-white transition-colors" aria-label="下一张">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                </button>
                <!-- 指示器 -->
                <div class="absolute bottom-4 left-4 px-2.5 py-1 rounded-full bg-black/50 text-white text-xs font-medium">
                    1/5
                </div>
            </section>

            <!-- 场地名称与评分 -->
            <section class="bg-white px-4 py-4">
                <div class="flex items-start justify-between gap-3">
                    <h2 class="text-[#1A1A1E] text-xl font-bold leading-tight">滨江滑板公园</h2>
                    <div class="flex items-center gap-1 shrink-0 text-[#FFB800]">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                        <span class="text-[#1A1A1E] font-semibold text-base">4.5</span>
                    </div>
                </div>

                <!-- 地址 -->
                <div class="mt-3 flex items-start gap-1.5 text-[#4D4D4D] text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mt-0.5 shrink-0 text-[#FF5A36]">
                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    <span>浦东新区滨江大道2888号</span>
                </div>

                <!-- 标签 -->
                <div class="mt-3 flex flex-wrap gap-2">
                    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full border border-[#E8E8E8] text-[#4D4D4D] text-xs">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 text-[#8C8C8C]">
                            <path d="M6 9V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5"/>
                            <path d="M6 11h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"/>
                            <circle cx="12" cy="14" r="2"/>
                        </svg>
                        混合
                    </span>
                    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full border border-[#E8E8E8] text-[#4D4D4D] text-xs">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 text-[#8C8C8C]">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M16 8h-6a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2h4a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2H8"/>
                            <path d="M12 18v2"/>
                            <path d="M12 6v-2"/>
                        </svg>
                        免费
                    </span>
                    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full border border-[#E8E8E8] text-[#4D4D4D] text-xs">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 text-[#8C8C8C]">
                            <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2 1.5-3.5A6 6 0 0 0 6 8c0 1 .5 2 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/>
                            <path d="M9 18h6"/>
                            <path d="M10 22h4"/>
                        </svg>
                        有灯
                    </span>
                    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full border border-[#E8E8E8] text-[#4D4D4D] text-xs">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 text-[#8C8C8C]">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <line x1="3" y1="9" x2="21" y2="9"/>
                            <line x1="9" y1="21" x2="9" y2="9"/>
                        </svg>
                        水泥
                    </span>
                </div>
            </section>

            <!-- 实时状态 -->
            <section class="mt-3 bg-white rounded-lg mx-4 p-4">
                <div class="flex items-center gap-2">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#00D4AA] opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#00D4AA]"></span>
                    </span>
                    <span class="text-[#1A1A1E] text-sm font-medium">此刻 12 位滑手在此</span>
                </div>
                <div class="mt-3 flex items-center gap-2">
                    <div class="w-9 h-9 rounded-full bg-[#FF5A36] text-white text-xs font-semibold flex items-center justify-center">AK</div>
                    <div class="w-9 h-9 rounded-full bg-[#2A8CFF] text-white text-xs font-semibold flex items-center justify-center">LY</div>
                    <div class="w-9 h-9 rounded-full bg-[#FFB800] text-white text-xs font-semibold flex items-center justify-center">MC</div>
                    <div class="w-9 h-9 rounded-full bg-[#00D4AA] text-white text-xs font-semibold flex items-center justify-center">JD</div>
                    <div class="w-9 h-9 rounded-full bg-[#E8E8E8] text-[#4D4D4D] text-xs font-semibold flex items-center justify-center">+9</div>
                </div>
            </section>

            <!-- 打卡动态 -->
            <section class="mt-3 px-4 pb-4">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-[#1A1A1E] text-base font-bold">打卡动态 (最近3条)</h3>
                    <a href="#" data-dom-id="link-all-checkins" class="text-[#8C8C8C] text-sm flex items-center gap-0.5 hover:text-[#FF5A36] transition-colors">
                        查看全部打卡
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5">
                            <path d="M9 18l6-6-6-6"/>
                        </svg>
                    </a>
                </div>

                <div class="space-y-3">
                    <!-- 动态卡片 1 -->
                    <article class="bg-white rounded-lg p-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-[#FF5A36] text-white text-sm font-semibold flex items-center justify-center">AK</div>
                            <div class="flex-1 min-w-0">
                                <p class="text-[#1A1A1E] text-sm font-medium truncate">滑板阿凯</p>
                                <p class="text-[#8C8C8C] text-xs">2小时前</p>
                            </div>
                        </div>
                        <p class="mt-2 text-[#4D4D4D] text-sm leading-relaxed">今天碗池人不多，练了几个新动作，地面很顺！</p>
                    </article>

                    <!-- 动态卡片 2 -->
                    <article class="bg-white rounded-lg p-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-[#2A8CFF] text-white text-sm font-semibold flex items-center justify-center">LY</div>
                            <div class="flex-1 min-w-0">
                                <p class="text-[#1A1A1E] text-sm font-medium truncate">LeoYoung</p>
                                <p class="text-[#8C8C8C] text-xs">5小时前</p>
                            </div>
                        </div>
                        <p class="mt-2 text-[#4D4D4D] text-sm leading-relaxed">晚上灯光明亮，适合夜滑，新手友好。</p>
                    </article>

                    <!-- 动态卡片 3 -->
                    <article class="bg-white rounded-lg p-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-[#FFB800] text-white text-sm font-semibold flex items-center justify-center">MC</div>
                            <div class="flex-1 min-w-0">
                                <p class="text-[#1A1A1E] text-sm font-medium truncate">MarsChen</p>
                                <p class="text-[#8C8C8C] text-xs">昨天</p>
                            </div>
                        </div>
                        <p class="mt-2 text-[#4D4D4D] text-sm leading-relaxed">周末小朋友有点多，建议大家错峰来。</p>
                    </article>
                </div>
            </section>
        </div>

        <!-- 底部固定操作栏 -->
        <div class="fixed bottom-14 left-0 right-0 z-20 bg-white border-t border-[#E8E8E8]">
            <div class="max-w-md mx-auto h-14 grid grid-cols-3">
                <button type="button" data-dom-id="btn-navigate" class="flex flex-col items-center justify-center gap-1 text-[#4D4D4D] hover:bg-[#F5F5F5] transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-[#FF5A36]">
                        <polygon points="3 11 22 2 13 21 11 13 3 11"/>
                    </svg>
                    <span class="text-xs">导航</span>
                </button>
                <button type="button" data-dom-id="btn-checkin" class="flex flex-col items-center justify-center gap-1 bg-[#FF5A36] text-white hover:bg-[#E63A16] transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    <span class="text-xs font-medium">签到</span>
                </button>
                <button type="button" data-dom-id="btn-report" class="flex flex-col items-center justify-center gap-1 text-[#4D4D4D] hover:bg-[#F5F5F5] transition-colors">
