    <style id="theme-vars">
/* Skate Spot UI — Brand tokens */

:root {
  /* Primary brand: neon orange-red */
  --skate-primary-50: #FFF2EE;
  --skate-primary-100: #FFE0D6;
  --skate-primary-200: #FFC1B0;
  --skate-primary-300: #FF9A7E;
  --skate-primary-400: #FF5A36;
  --skate-primary-500: #FF4A24;
  --skate-primary-600: #E63A16;

  /* Neutral: street black + concrete grey scale */
  --skate-neutral-0: #FFFFFF;
  --skate-neutral-50: #F5F5F5;
  --skate-neutral-100: #E8E8E8;
  --skate-neutral-200: #D9D9D9;
  --skate-neutral-400: #8C8C8C;
  --skate-neutral-600: #4D4D4D;
  --skate-neutral-900: #1A1A1E;

  /* State colors */
  --skate-state-success: #00D4AA;
  --skate-state-warning: #FFB800;
  --skate-state-error: #FF3B30;
  --skate-state-info: #2A8CFF;

  /* Semantic aliases */
  --skate-background: var(--skate-neutral-50);
  --skate-foreground: var(--skate-neutral-900);
  --skate-card: var(--skate-neutral-0);
  --skate-card-foreground: var(--skate-neutral-900);
  --skate-popover: var(--skate-neutral-0);
  --skate-popover-foreground: var(--skate-neutral-900);
  --skate-primary: var(--skate-primary-400);
  --skate-primary-foreground: var(--skate-neutral-0);
  --skate-muted: var(--skate-neutral-100);
  --skate-muted-foreground: var(--skate-neutral-400);
  --skate-border: var(--skate-neutral-100);
  --skate-input: var(--skate-neutral-100);
  --skate-ring: var(--skate-primary-400);

  /* Radius */
  --skate-radius-sm: 4px;
  --skate-radius-md: 8px;
  --skate-radius-lg: 12px;
  --skate-radius-full: 9999px;

  /* Typography */
  --skate-font-title: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  --skate-font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;

  /* Shadow (only for floating layers) */
  --skate-shadow-float: 0 8px 24px rgba(26, 26, 30, 0.10);
}

@theme inline {
  --color-background: var(--skate-background);
  --color-foreground: var(--skate-foreground);
  --color-card: var(--skate-card);
  --color-card-foreground: var(--skate-card-foreground);
  --color-popover: var(--skate-popover);
  --color-popover-foreground: var(--skate-popover-foreground);
  --color-primary: var(--skate-primary);
  --color-primary-foreground: var(--skate-primary-foreground);
  --color-muted: var(--skate-muted);
  --color-muted-foreground: var(--skate-muted-foreground);
  --color-border: var(--skate-border);
  --color-input: var(--skate-input);
  --color-ring: var(--skate-ring);
  --radius-sm: var(--skate-radius-sm);
  --radius-md: var(--skate-radius-md);
  --radius-lg: var(--skate-radius-lg);
  --radius-full: var(--skate-radius-full);
}
